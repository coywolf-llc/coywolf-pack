# Weekly dependency updates for this repository: one pull request for the npm
# devDependencies and one for the GitHub Actions, each run through CI (ci.yml).
#
# Only devDependencies are updated. The peerDependencies are the ranges sites may
# install and change only by hand (Dependabot doesn't edit them).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    allow:
      - dependency-type: development
    # Raise the ranges in package.json too, so they say what's tested.
    versioning-strategy: increase
    ignore:
      # Follows the exact version EmDash's admin pins (CI fails when they differ): changed by hand with EmDash.
      - dependency-name: "@cloudflare/kumo"
      # A new TypeScript major is its own change.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
